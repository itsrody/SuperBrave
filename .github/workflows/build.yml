name: build

on:
  schedule:
    # Upstream lists are updated continuously; a weekly build keeps SuperBrave.txt
    # current without churning on every upstream commit.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: superbrave-build
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Fetch upstream lists
        run: cargo run --release -- fetch

      - name: Build and verify SuperBrave.txt
        # The build refuses to emit if the self-consistency gate fails, so a
        # failure here means the list is not trustworthy, not just absent.
        run: |
          set -o pipefail
          cargo run --release -- build 2>&1 | tee build.log
          {
            echo "### Build summary"
            echo
            echo '```'
            cat build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: superbrave
          path: |
            SuperBrave.txt
            report.json
          if-no-files-found: error

      - name: Commit the built list
        id: publish
        run: |
          if git diff --quiet -- SuperBrave.txt report.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "list is unchanged from the committed copy"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SuperBrave.txt report.json
          git commit -m "build: regenerate SuperBrave.txt from upstream lists"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --stat HEAD~1 -- SuperBrave.txt